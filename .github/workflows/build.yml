name: Compilar e verificar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar e verificar integracao
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Guardar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: Loja-Tecnologia-Windows
          path: dist/
